version: 2
updates:
  # Keep the GitHub Actions we pin (checkout, codecov, codeql, gh-release) current.
  # The app itself has no third-party dependencies, so there's nothing else to watch.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      # init and analyze must stay on the same version, so they're bumped in one PR.
      codeql:
        patterns: ["github/codeql-action*"]
