name: release

# Cut a release by pushing a tag: `git tag vX.Y && git push origin vX.Y`.
# The tag's version MUST match VERSION in build.sh (the build job verifies and fails otherwise).
#
#   build    no secrets. Tests, builds the universal app (ad-hoc signed) and hands it on as an artifact.
#   sign     runs in the `release` environment, the only place the signing secrets exist. GitHub only
#            starts it after the owner approves it, and only for v* tags. It runs no code from the repo
#            and no third-party actions: Developer ID signing with the hardened runtime, notarization,
#            stapling and Gatekeeper's own check, in a throwaway keychain.
#   publish  no secrets. Attests provenance of the signed zip and attaches it to a draft release.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify tag matches build.sh VERSION
        id: version
        run: |
          set -euo pipefail
          CODE_VER="$(sed -n 's/^VERSION=//p' build.sh)"
          TAG_VER="${GITHUB_REF_NAME#v}"
          echo "tag=$TAG_VER  code=$CODE_VER"
          if [ "$TAG_VER" != "$CODE_VER" ]; then
            echo "::error::tag v$TAG_VER does not match VERSION in build.sh ($CODE_VER). Bump build.sh first."
            exit 1
          fi
          echo "version=$CODE_VER" >> "$GITHUB_OUTPUT"

      - name: Test (gate)
        run: ./test.sh

      - name: Build universal app
        id: pack
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./build.sh   # also verifies both architectures and the signature
          mv "build/Sempre-$VERSION.zip" unsigned.zip
          echo "sha256=$(shasum -a 256 unsigned.zip | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned
          path: unsigned.zip
          retention-days: 30   # the sign job waits for approval, at most 30 days

  sign:
    needs: build
    runs-on: macos-15
    environment: release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned

      - name: Check it is the app the build job made
        env:
          EXPECTED: ${{ needs.build.outputs.sha256 }}
        run: echo "$EXPECTED  unsigned.zip" | shasum -a 256 -c

      - name: Import the certificate into a throwaway keychain
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PASS="$(openssl rand -base64 32)"
          echo "::add-mask::$KC_PASS"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$CERT_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KC" | awk -F'"' '/Developer ID Application/ { print $2; exit }')"
          if [ -z "$IDENTITY" ]; then echo "::error::no Developer ID Application identity in MACOS_CERT_P12"; exit 1; fi
          echo "IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "KC=$KC" >> "$GITHUB_ENV"

      - name: Sign with the hardened runtime
        run: |
          set -euo pipefail
          ditto -x -k unsigned.zip .
          codesign --force --options runtime --timestamp --keychain "$KC" --sign "$IDENTITY" Sempre.app
          codesign --verify --strict --verbose=2 Sempre.app
          codesign -dvv Sempre.app > codesign.txt 2>&1
          grep -E '^(Authority|TeamIdentifier|Timestamp)=' codesign.txt
          grep -q '(runtime)' codesign.txt || { echo "::error::hardened runtime flag missing"; exit 1; }
          ditto -c -k --keepParent Sempre.app notarize.zip

      - name: Notarize and staple
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_API_ISSUER }}
        run: |
          set -euo pipefail
          umask 077
          KEY="$RUNNER_TEMP/notary.p8"
          trap 'rm -f "$KEY"' EXIT
          printf '%s\n' "$NOTARY_KEY" > "$KEY"
          AUTH=(--key "$KEY" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER")
          xcrun notarytool submit notarize.zip "${AUTH[@]}" --wait --timeout 30m --output-format json > notary.json || true
          ID="$(plutil -extract id raw notary.json 2>/dev/null || echo '?')"
          STATUS="$(plutil -extract status raw notary.json 2>/dev/null || echo 'no response')"
          echo "submission $ID: $STATUS"
          if [ "$STATUS" != "Accepted" ]; then
            [ "$ID" != '?' ] && xcrun notarytool log "$ID" "${AUTH[@]}" || true
            echo "::error::notarization $STATUS"
            exit 1
          fi
          xcrun stapler staple Sempre.app
          xcrun stapler validate Sempre.app

      - name: Gatekeeper check
        run: |
          set -euo pipefail
          spctl --assess --type execute --verbose=4 Sempre.app 2>&1 | tee spctl.txt
          if grep -q 'override=security disabled' spctl.txt; then
            echo "::warning::Gatekeeper is off on this runner; relying on the codesign and stapler checks above"
          else
            grep -q 'source=Notarized Developer ID' spctl.txt
          fi
          ditto -c -k --keepParent Sempre.app "Sempre-$GITHUB_REF_NAME.zip"
          shasum -a 256 "Sempre-$GITHUB_REF_NAME.zip"

      - name: Delete the keychain and key files
        if: always()
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"   # set here too: the import step may have failed early
          [ -e "$KC" ] && security delete-keychain "$KC" || true
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/notary.p8"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed
          path: Sempre-${{ github.ref_name }}.zip
          retention-days: 1

  publish:
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the draft release
      id-token: write        # provenance attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed

      - name: Attest provenance of the signed zip
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: Sempre-${{ github.ref_name }}.zip

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "Sempre-$GITHUB_REF_NAME.zip" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft --generate-notes --title "$GITHUB_REF_NAME"
